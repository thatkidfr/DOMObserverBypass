
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Page</title>
  <style>
    iframe {
      display: block;
    }
  </style>
</head>
<body>

  <h1>Tab is now frozen from DOM mutations/updates</h1>

  <script>
    const iframe = document.createElement("iframe");
    document.body.appendChild(iframe);
    iframe.contentDocument.write("<iframe src='https://example.com'>");
  </script>

  <p>This will not be displayed. The code above freezes the webpage.</p>

</body>
</html>
