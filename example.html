
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Page</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <script>
    const iframe = document.createElement("iframe");
    
    document.body.appendChild(iframe);
    
    iframe.contentDocument.write("<iframe src='https://example.com'>");
  </script>
  
  <h1>Loading Site</h1>

  
</body>
</html>
